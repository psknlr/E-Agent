name: Deploy E-Agent chat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests load the real WebAssembly runtime, so Node is pinned rather than
      # taken from whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check the actual chat runtime
        run: python -m pytest tests/test_web.py tests/test_request_client.py tests/test_providers.py tests/test_toolloop.py tests/test_browser_bundle.py tests/test_engine.py tests/test_build_engine.py tests/test_export_site.py tests/test_numeric_guard.py tests/test_robustness.py -q
      - name: Check browser evidence and the agent catalog match the Python code
        run: python scripts/build_browser_bundle.py --check
      - name: Check browser scripts
        run: |
          for script in web/*.js; do node --check "$script"; done
      - name: Check browser agent, tools, panels and calculations
        run: node --test tests/browser-*.test.cjs
      # The engine is Python compiled to WebAssembly, assembled from pinned
      # registry downloads. Every download is checked against scripts/engine.lock.json
      # and a mismatch stops the deploy; the cache only saves the transfer.
      - uses: actions/cache@v4
        with:
          path: .cache/engine
          key: engine-${{ hashFiles('scripts/engine.lock.json') }}
      - name: Build the compute engine
        run: python scripts/build_engine.py
      - name: Check the engine build is complete and current
        run: python scripts/build_engine.py --check
      - name: Check the WebAssembly engine against native Python, and the whole stack through it
        env:
          EAGENT_REQUIRE_ENGINE: '1'
        run: node --test tests/engine-*.test.cjs
      - name: Configure public backend URL
        env:
          EAGENT_BACKEND_URL: ${{ vars.EAGENT_BACKEND_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ.get('EAGENT_BACKEND_URL', '').strip().rstrip('/')
          if url:
              parsed = urlsplit(url)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit('EAGENT_BACKEND_URL must be a public HTTPS URL without credentials, query or fragment')
              Path('web/config.json').write_text(json.dumps({'backend_url': url}) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy chat interface
        id: deployment
        uses: actions/deploy-pages@v4
