name: Deploy E-Agent chat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check the actual chat runtime
        run: python -m pytest tests/test_web.py tests/test_request_client.py tests/test_providers.py tests/test_toolloop.py -q
      - name: Check browser script
        run: node --check web/app.js
      - name: Configure public backend URL
        env:
          EAGENT_BACKEND_URL: ${{ vars.EAGENT_BACKEND_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ.get('EAGENT_BACKEND_URL', '').strip().rstrip('/')
          if url:
              parsed = urlsplit(url)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit('EAGENT_BACKEND_URL must be a public HTTPS URL without credentials, query or fragment')
              Path('web/config.json').write_text(json.dumps({'backend_url': url}) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy chat interface
        id: deployment
        uses: actions/deploy-pages@v4
