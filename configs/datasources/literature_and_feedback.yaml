      Valued for citation-backed curation, gated on terms.

  - id: enzymeml
    display_name: EnzymeML
    layers: [literature_and_feedback]
    good_for:
      - A structured format for this project's own experimental output, holding
        the protein, the reaction, the conditions, the measured time courses and
        the analysis together in one document.
      - Making internal batches machine-readable so a result can re-enter the
        next round of candidate selection instead of living in a spreadsheet.
      - Interoperability with external records captured against the same
        reporting conventions.
    not_good_for:
      - It is a data standard, not another database; it supplies no external
        records and must never be counted as a source of evidence about other
        people's enzymes.
      - A document in the format is only as good as the experiment it records --
        the format enforces structure, not correctness, and will faithfully
        store an unvalidated detection method.
      - Adopting the format does not by itself make internal and external records
        comparable, because unit and condition conventions still have to be agreed.
    access_modes: [local_package, offline_import]
    capabilities:
      keyword_query: not_supported
      exact_record_fetch: not_supported
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: not_supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: sequence_level_experimental
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm the format version and the tooling this project will use, and
         record both; no implementation is asserted to be installed here."
      - "The sequence-level ceiling applies only to this project's own
         measurements recorded with the expressed construct sequence and a
         product-identifying detection method. A document missing either must
         enter at a lower strength."
      - "Agree the unit and condition conventions before the first batch is
         recorded, since retrofitting them across batches is not reliable."
      - "Decide the licence under which internal records may later be published."
    notes: >-
      The feedback half of this layer. Without it the project cannot learn from
      its own negative results, which are its most valuable records.
