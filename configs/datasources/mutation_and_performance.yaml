  - id: catpred_db
    display_name: CatPred-DB
    layers: [mutation_and_performance]
    good_for:
      - Assembled kinetic parameter data in a form suitable for training and
        evaluating kinetic prediction, with consistent field definitions.
      - A convenient view over kinetics that would otherwise need assembling from
        two enzymology resources.
    not_good_for:
      - It is a dataset, not the prediction model that shares its name, and the
        two must not be conflated in provenance or in a results narrative.
      - It is derived from BRENDA and SABIO-RK, so a value found here and in
        either upstream is one measurement, not two, and it provides no
        independent confirmation of them.
      - Dataset assembly applies filters and unit conversions that can change a
        value's meaning; the upstream record must be consulted before a number is
        quoted.
      - Training-set membership is not experimental validation.
    access_modes: [bulk_download, offline_import]
    capabilities:
      keyword_query: not_supported
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: ec_species_mapped
    derived_from: [brenda, sabio_rk]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm the upstream releases used, and whether any further source was
         included; derived_from is marked incomplete for that reason."
      - "Confirm the distribution route, version and licence; no URL is recorded."
      - "Confirm whether upstream record identifiers are retained, since
         de-duplication against the enzymology layer depends on them."
      - "Record the unit conventions applied during assembly, so converted values
         are not compared with raw upstream ones."
    notes: >-
      Registered chiefly so the independence accounting puts it in the same group
      as its upstreams.

  - id: esibank
    display_name: ESIBank
    layers: [mutation_and_performance]
    good_for:
      - Assembled enzyme-substrate interaction data at a scale useful for
        training and for prioritising which pairs are worth testing.
      - A substrate-centred view, which is closer to this project's question than
        an EC-centred one.
    not_good_for:
      - It is the data resource associated with a specificity model, not the
        model itself; keeping that distinction is required in provenance, and a
        model prediction must never be stored as a database record.
      - Pairs arrive with varying original evidence strength. That strength must
        be preserved per pair, and no pair may be promoted to a verified
        sequence-level label just because it appears in the collection.
      - Absence of a pair is not a tested negative.
      - Assembly decisions and filters can change what a pair means, so the
        original record must remain reachable.
    access_modes: [bulk_download, offline_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: unknown
      chemical_structure_query: unknown
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: ec_species_mapped
    derived_from: []
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "derived_from is empty and marked incomplete -- an assembled pair
         collection necessarily has upstream sources, and they must be recorded
         before it counts as independent of the enzymology layer."
      - "Confirm the distribution route, version, citation and licence."
      - "Confirm which field carries the original evidence strength per pair; if
         there is none, every pair must enter at the lowest strength rather than
         at the ceiling."
    notes: >-
      The model-versus-dataset distinction is the reason this entry exists
      separately from any predictor registered as a tool.

  - id: reactzyme
    display_name: ReactZyme
    layers: [mutation_and_performance]
    good_for:
      - Evaluating enzyme-reaction retrieval, which is the shape of this
        project's own search problem, so it can measure whether the retrieval
        step works at all.
      - Standardised splits for comparing retrieval approaches.
    not_good_for:
      - It contains positives. An absent enzyme-reaction pair is not an
        experimental negative, and training or evaluating as though absence means
        inactivity will manufacture false confidence.
      - It is a benchmark, not an evidence source; a retrieved pair is not a
        measurement.
      - Pairs derive from public annotation, so a hit here and an annotation in
        the upstream resources are not independent.
      - Reaction granularity may not match the stereochemical precision this task
        requires.
    access_modes: [bulk_download, local_package]
    capabilities:
      keyword_query: not_supported
      exact_record_fetch: unknown
      sequence_query: unknown
      chemical_structure_query: unknown
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: [rhea, uniprotkb]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 3
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "derived_from records the reaction and sequence resources it is believed
         to be assembled from, deliberately in the conservative direction, and is
         marked incomplete. A curator must confirm the actual construction."
      - "Confirm the distribution route, version, citation and licence."
      - "Record explicitly, in any evaluation built on it, that negatives are
         unobserved pairs rather than tested ones."
    notes: >-
      Evaluation only. Registered here because the retrieval it measures is the
      step that feeds this layer.
