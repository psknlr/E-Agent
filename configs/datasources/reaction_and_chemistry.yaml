# Layer 1 -- reaction and chemistry.
#
# HONESTY RULE FOR THIS DIRECTORY: nothing in these files was verified in this
# environment. Anything not known with confidence is null with
# needs_curation: true and a note saying what a curator must confirm.
#
# As of this revision no entry in this directory records an endpoint at all:
# every `endpoint` key is null. Where a base URL was recalled from general
# knowledge it sits in that entry's curation_notes, labelled as a starting hint
# that has never been called, because a hint in a note cannot be read
# programmatically as an established route the way an `endpoint` value can.
# The same rule holds for record counts, version strings and licence terms.
#
# Every entry carries connectivity_verified: false. Capability flags describe
# what a resource is documented to offer, not what has been proven to work.

layer: reaction_and_chemistry
layer_question: >-
  What is the substrate, which bond changes, and what is the product
  configuration?
agent_stages:
  - task normalisation
  - reaction search
notes: >-
  This layer defines the transformation. Nothing in it is evidence that any
  particular protein catalyses that transformation; that is the enzymology
  evidence layer, and the two must not be merged on an EC number.

sources:
  - id: rhea
    display_name: Rhea
    layers: [reaction_and_chemistry]
    good_for:
      - Reaction-level definition of a transformation with participants given as
        ChEBI entries, so the substrate and product are structures rather than names.
      - Stable reaction identifiers usable as an explicit join key between the
        reaction layer and sequence annotation that cross-references them.
      - Preserves reaction direction as a modelled property (a directional entry
        and its bidirectional parent), which is what lets a record state which
        way the measured reaction ran.
      - Mapping between EC classes and specific balanced reactions, useful for
        turning a prose task description into a defined transformation.
    not_good_for:
      - Not evidence that any specific sequence catalyses the reaction; a Rhea
        identifier attached to a protein entry is an annotation, not a measurement.
      - The reference direction of an entry is a curatorial convention. Citing a
        Rhea id does not record which direction was assayed, and an
        oxidation-direction record must never be ingested as reduction evidence
        for the target reaction.
      - Participants are defined at a chosen protonation state and may differ
        from the material actually used in an assay (salt form, charge, purity).
      - No kinetics, no reaction conditions, no enantioselectivity; a reaction
        entry cannot answer "which enantiomer".
    access_modes: [rest_api, sparql, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm the current programmatic routes and record exact base URLs for
         the REST and SPARQL services; both are left null here rather than guessed."
      - "Confirm the licence and whether derived records may be redistributed."
      - "Record the release string used for a run so the reaction definitions can
         be pinned in the manifest."
      - "Confirm how the directional and bidirectional entries are related in the
         current data model before any direction logic is written against them."
    notes: >-
      Primary identifier source for the reaction layer. The direction caveat is
      the one that matters for the pilot task: a ketone/alcohol pair is one
      reaction entry read in two directions.

  - id: chebi
    display_name: ChEBI
    layers: [reaction_and_chemistry]
    good_for:
      - Stable chemical identifiers for reaction participants, used as a join key
        with Rhea and with literature annotation corpora.
      - An explicit ontology (is_a, has_role, conjugate acid/base) that makes the
        difference between a chemical class and a specific compound machine-readable.
      - Curated structures and cross-references for well-defined small molecules.
    not_good_for:
      - A class entry (for example a generic "ketone" or "secondary alcohol"
        class) covers many compounds and must never be used as the assay
        substrate; resolving a task substrate to a class entry silently widens
        the task.
      - The protonation and charge state of an entry is a curatorial choice, not
        the state of the compound in the reaction vessel.
      - Carries no supplier, purity, salt form or enantiomeric composition.
      - Carries no activity evidence of any kind.
    access_modes: [rest_api, soap, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm which programmatic interfaces are current (a SOAP service and
         bulk downloads have historically been offered) and record their base
         URLs; all are null here rather than guessed."
      - "Confirm the licence and redistribution terms."
      - "Record the monthly release identifier used in a run."
      - "Decide and document the project rule for class-versus-instance entries:
         a class entry must fail task normalisation rather than be accepted."
    notes: >-
      The class/instance distinction is the whole reason this resource is
      registered separately from PubChem.

  - id: pubchem
    display_name: PubChem
    layers: [reaction_and_chemistry]
    good_for:
      - Normalising a trivial, catalogue or paper-prose compound name to a CID
        and then to SMILES/InChI, at a scale no curated resource matches.
      - Synonym coverage, which is what makes extraction from literature text
        resolvable at all.
      - Scripted normalisation of many names in one pass during task setup.
    not_good_for:
      - Name resolution routinely returns the wrong stereoisomer, a salt, or a
        different charge state. Chirality, salt form and protonation must be
        re-verified after every lookup; for an asymmetric reduction task this is
        the difference between the right and the wrong experiment.
      - Depositor-contributed records vary in quality and can disagree with each
        other for the same compound.
      - BioAssay content is heterogeneous screening data and is not
        enzyme-substrate activity evidence for this project.
      - A CID identifies a compound, not a reaction, and carries no direction.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: supported
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint is recorded, because none has been established here. As a
         starting hint for a curator and nothing more: this project's general
         knowledge suggests a PUG REST service under a base of the form
         https://pubchem.ncbi.nlm.nih.gov/rest/pug, with a PUG REST page in the
         provider's own documentation. Neither string was called or opened from
