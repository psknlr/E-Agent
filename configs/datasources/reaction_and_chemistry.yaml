    notes: >-
      Registered as a name-resolution service with a mandatory verification step,
      not as a source of chemical truth.

  - id: metanetx
    display_name: MetaNetX / MNXref
    layers: [reaction_and_chemistry]
    good_for:
      - Reconciling compound and reaction identifiers across several chemical and
        metabolic resources through one namespace, so that two resources can be
        recognised as describing the same transformation.
      - Finding the identifier a given resource uses for a compound already
        identified in another resource, which is the practical blocker in
        cross-database assembly.
    not_good_for:
      - A mapping edge is a reconciliation decision, not a statement of chemical
        identity. Mapped entities may differ from the upstream ones in
        protonation, stereochemistry or cofactor specificity, so one mapping edge
        does not license merging all chemical states of a compound.
      - Not an evidence source at all -- it contains no measurements and no
        conditions.
      - Mapping decisions change between versions, so a join made through it must
        record the version or it is not reproducible.
      - Because it re-integrates other resources, agreement between MetaNetX and
        an upstream resource is not corroboration.
    access_modes: [bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: [rhea, chebi]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "The upstream list recorded here (Rhea, ChEBI) is partial: MNXref
         reconciles several further resources. A curator must complete
         derived_from before MetaNetX is counted as independent of anything."
      - "Confirm whether any programmatic interface is offered; only bulk
         download is registered, and no endpoint is recorded."
      - "Record the MNXref version used for any join made through it."
      - "Confirm licence and redistribution terms."
    notes: >-
      Registered as a mapping aid whose edges must be re-checked, never as a
      merge authority.

  - id: enzymemap
    display_name: EnzymeMap
    layers: [reaction_and_chemistry]
    good_for:
      - Curated and atom-mapped enzymatic reactions, which make the bond that
        changes explicit instead of leaving it to be inferred from two SMILES.
      - Supplying the reactive-atom assignment the geometry layer needs
        (electrophilic carbon, stabilised oxygen, prochiral centre).
      - Extracting reaction templates with a traceable origin.
    not_good_for:
      - Reaction-level resource. An entry is NOT a claim that each associated
        sequence was experimentally validated on that substrate, and must not be
        ingested as sequence-level activity evidence.
      - Atom mapping is computed; for unusual or multi-step chemistry it can be
        wrong, and a wrong mapping produces a confidently wrong reactive atom.
      - It re-curates an upstream enzymology corpus, so agreement with that corpus
        is not independent confirmation.
      - Contains no conditions, no detection method and no stereochemical outcome.
    access_modes: [bulk_download, offline_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: [brenda]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "derived_from records BRENDA as an upstream corpus; a curator must confirm
         the full upstream set and the release used, because this determines
         whether EnzymeMap can count as independent of the enzymology layer."
      - "Confirm the distribution location, licence and citation; no DOI is
         recorded here because none was verified."
      - "Confirm how atom-mapping confidence is expressed per reaction, so
         low-confidence mappings can be rejected rather than silently used."
    notes: >-
      Valued for atom mapping, not for evidence. Its records enter the reaction
      layer only.

  - id: retrorules
    display_name: RetroRules
    layers: [reaction_and_chemistry]
    good_for:
      - Reaction rules at several reaction-centre diameters, usable to enumerate
        candidate transformations for a substrate that has no exact precedent.
      - Keeping each rule's provenance, so an enumerated transformation can be
        traced back to the reactions it was generalised from.
    not_good_for:
      - A rule firing is an enumeration, not a demonstrated enzymatic reaction,
        and must never be recorded as an observed transformation.
      - Rules generalise across substrates by construction, so rule coverage is
        not substrate scope and says nothing about rate or selectivity.
      - Rules of organic-chemistry origin are not demonstrated enzymatic
        reactions; their provenance must be kept and surfaced wherever a
        candidate transformation derived from them is shown.
      - Rules generally do not preserve the stereochemical outcome that the pilot
        task is about.
    access_modes: [bulk_download, offline_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: computational_construct
    derived_from: [metanetx, rhea]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 3
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm the upstream reaction sets each rule was derived from; the list
         here is partial and is marked incomplete."
      - "Confirm distribution location, version and licence."
      - "Define the project rule that any candidate reached only through a rule is
         labelled computational_construct and never promoted without an experiment."
    notes: >-
      Stage 3. Useful only once the exact-precedent search has been exhausted,
      and then only as a hypothesis generator.

  - id: enzyme_explorenz
    display_name: ENZYME / ExplorEnz (IUBMB enzyme nomenclature)
    layers: [reaction_and_chemistry]
    good_for:
      - Authoritative EC nomenclature -- accepted and systematic names, the
        official reaction, and the class hierarchy.
      - Detecting transferred and deleted EC numbers, which silently corrupt any
        pipeline that keys on EC.
      - Translating a prose enzyme-class description into a defined reaction class.
    not_good_for:
      - An EC number is a reaction-class label and is not sufficient evidence of
        specificity for a given substrate; two enzymes sharing an EC number may
        have no overlap in substrate scope.
      - EC assignments in sequence databases are frequently propagated by
        similarity, so an EC match is not an experimental result.
      - Carries no sequence-level evidence, no conditions, no cofactor preference
        and no stereo-preference.
    access_modes: [bulk_download, manual_review_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: ec_species_mapped
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
