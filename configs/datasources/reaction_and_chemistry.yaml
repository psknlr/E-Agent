         request-rate policy, record the documentation as a citation, and only
         then set endpoint."
      - "Confirm whether a stable release or snapshot identifier can be recorded
         for provenance; version_information is marked unknown because this
         project has not established one."
      - "Confirm licence and redistribution terms for derived records."
      - "Write the post-resolution chirality/salt/charge check before this source
