    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint recorded; confirm the API base URL and the bulk distribution
         before use."
      - "Confirm which quality and completeness flags are available per sequence,
         because the staging rule depends on being able to keep them."
      - "Confirm licence and redistribution terms, and record the catalogue
