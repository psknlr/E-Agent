  - id: akr_superfamily
    display_name: AKR Superfamily database (aldo-keto reductases)
    layers: [sequence_family_evolution]
    good_for:
      - Authoritative nomenclature for aldo-keto reductases, the second major
        family relevant to asymmetric ketone reduction, where naming in the
        literature is otherwise inconsistent.
      - Curated sequences, alignments and phylogeny for the superfamily, usable
        to seed a family-aware expansion.
      - Resolving which published name corresponds to which sequence, a frequent
        blocker when mining older biocatalysis papers.
    not_good_for:
      - Nomenclature and phylogeny are not activity data; no substrate scope,
        kinetics or enantioselectivity is implied by membership.
      - No stable public programmatic interface has been verified, so it is
        registered for human import rather than as a queryable service.
      - Coverage follows the curators' nomenclature decisions and is not a
        complete census of the superfamily.
    access_modes: [manual_review_import, offline_import]
