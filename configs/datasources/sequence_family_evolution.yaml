  - id: ncbi_protein
    display_name: NCBI Protein (RefSeq, GenBank, Identical Protein Groups)
    layers: [sequence_family_evolution]
    good_for:
      - Expanding a candidate set beyond curated entries, including sequences
        that never reach a reviewed database.
      - Nucleotide traceback from a protein record, which is what a synthesis
        order actually needs -- codon context, source organism and the coding
        sequence.
      - Identical protein groupings that collapse the same sequence submitted
        many times, preventing a candidate list that is one protein repeated.
      - Taxonomic breadth for diversity selection.
    not_good_for:
      - Annotation quality varies widely, and a protein name is frequently
        propagated from a distant homologue; a name is not a function.
      - Predicted records from automated annotation pipelines are hypotheses, not
        observed proteins.
      - No activity, conditions or stereochemistry of any kind.
      - Records are revised and suppressed, so a bare accession without its
        version is not a stable identity.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
