  - id: cath_funfam
    display_name: CATH and FunFams
    layers: [sequence_family_evolution]
    good_for:
      - Structural classification of domains, which groups candidates by fold
        rather than by sequence similarity alone.
      - Functional families within a superfamily, a finer grouping than fold and
        often closer to mechanism.
      - Recognising that two low-identity candidates share an architecture.
    not_good_for:
      - A shared fold is compatible with completely different chemistry; fold is
        not mechanism and certainly not substrate scope.
      - Functional family assignment is computational and inherits the errors of
        the classification pipeline.
      - Not an evidence source; nothing here was measured on a substrate.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
