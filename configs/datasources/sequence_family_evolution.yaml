  - id: mgnify_proteins
    display_name: MGnify Proteins
    layers: [sequence_family_evolution]
    good_for:
      - Metagenome-derived sequences that are absent from cultured-organism
        databases, which is where genuinely novel candidates come from.
      - Very large sequence space for family expansion once the seeds and family
        models are already established.
      - Quality and completeness flags that let obviously fragmentary predictions
        be rejected before they consume modelling time.
    not_good_for:
      - Sequences are predicted from assemblies, so a record may be a fragment, a
        chimera or an assembly artefact rather than a real protein.
      - No organism in hand, so expression host, codon usage and solubility are
        all unknown at the point of selection.
      - Novelty alone must not buy a synthesis slot; a candidate from here needs
        at least family-model and geometric support before it competes with a
        sequence that has literature behind it.
      - No annotation evidence of any kind, and no activity data.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
