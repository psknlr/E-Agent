# Layer 3 -- sequence, family and evolution.
#
# HONESTY RULE: nothing in this file was verified in this environment. Unknown
# specifics are null with needs_curation: true, and that includes every
# `endpoint` key -- as of this revision no entry here records one. A base URL
# recalled from general knowledge lives in that entry's curation_notes as a
# starting hint that has never been called, where no code can mistake it for an
# established route. Record counts, version strings and licence terms follow
# the same rule. connectivity_verified is false everywhere. Capability flags
# describe documented capability, not proven behaviour.

layer: sequence_family_evolution
layer_question: >-
  Which sequences are worth expanding, and which belong to the same mechanism
  family?
agent_stages:
  - mining
  - clustering
  - diversity selection
notes: >-
  Everything in this layer is about relatedness. Nothing in it is about activity
  on the target substrate. The layer exists to widen a candidate set and to keep
  it diverse, and its records are joined to the evidence layer only through a
  sequence hash or an accession with its database release, never through a
  similarity score.

sources:
  - id: uniprotkb
    display_name: UniProtKB (Swiss-Prot and TrEMBL)
    layers: [sequence_family_evolution]
    good_for:
      - The reference sequence record for most candidates, with cross-references
        that let a sequence be joined to structures, families and reactions.
      - Annotation evidence codes, which distinguish a statement supported by an
        experiment on that entry from one propagated by similarity or by rule.
      - Reviewed entries that summarise the published function of well-studied
        enzymes, useful as seeds.
      - Organism, taxonomy and sequence-version history needed for reproducible
        joins.
    not_good_for:
      - Not every functional statement is an experimental result for that
        sequence. The evidence code must be kept and surfaced, because an
        inferred catalytic activity annotation reads identically to a measured one.
      - An EC number or catalytic activity line is an annotation, not a
        substrate-scope measurement, and never establishes activity on the target
        substrate.
      - Entries are merged, demerged and re-annotated between releases, so an
        accession without its release is not a stable identity.
      - The canonical sequence is not the construct anyone expressed.
    access_modes: [rest_api, sparql, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: supported
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "The REST base URL was once only a starting hint here -- recalled, never
         called. It has since been established: `eagent sources verify` fetched
         one entry by accession and one search response from
         https://rest.uniprot.org and opened the provider's API help page, and
         the record of those calls is in connectivity.observed.yaml. The hint is
         kept so a reader can see which it was. STILL OPEN: the SPARQL endpoint,
         which is a separate service and has not been called."
      - "Confirm the licence and whether derived records may be redistributed."
      - "Record the release identifier used in each run so accessions resolve to
         the same entries later."
      - "Confirm which evidence codes the project will accept as experimental,
         and implement that filter before UniProt annotation reaches a candidate
         score."
    notes: >-
      The hub of the sequence layer. Its annotation is a pointer to evidence, not
      evidence, and the ceiling is set accordingly.

  - id: uniparc
    display_name: UniParc
    layers: [sequence_family_evolution]
    good_for:
      - A non-redundant archive of sequences with their history, which answers
        whether two differently named records are literally the same sequence.
      - Recovering a sequence that has been removed from or merged within an
        active database, which otherwise breaks a historical record.
      - Stable sequence-level identity independent of annotation churn.
    not_good_for:
      - No annotation and no function; it answers identity questions only.
      - Presence in the archive says nothing about whether a protein exists,
        expresses, or has any measured activity.
      - It aggregates sequences from many upstream databases, so its content is
        not independent of them.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: supported
      sequence_query: supported
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "derived_from is empty but marked incomplete on purpose -- UniParc
         aggregates sequences from many source databases, and a curator must
         record which of them matter for this project's independence accounting."
      - "No endpoint recorded. Confirm the access route before use."
      - "Confirm licence and redistribution terms."
    notes: >-
      Registered separately from UniRef because sequence identity and history is
      a different job from clustering.

  - id: uniref
    display_name: UniRef (50 / 90 / 100 clusters)
    layers: [sequence_family_evolution]
    good_for:
      - Ready-made clustering at fixed identity thresholds, used to deduplicate a
        candidate set and to control redundancy in a selection.
      - A cheap first pass at diversity selection before any alignment is run.
      - Cluster representatives that make a large search space tractable.
    not_good_for:
      - Cluster co-membership is a computed grouping, not an identity and not a
        shared function; two members of one cluster can differ in substrate scope
        and in stereopreference.
      - Cluster membership must never be used to transfer an activity record from
        one member to another; that is a similarity join wearing a cluster id.
      - Thresholds are arbitrary with respect to mechanism, so the right identity
        cut for one family is wrong for another.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: computational_construct
    derived_from: [uniprotkb, uniparc]
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint recorded; confirm the access route before use."
      - "Record the release used, because cluster composition changes between
         releases and a diversity selection is not reproducible without it."
      - "Confirm licence and redistribution terms."
    notes: >-
      The ceiling is computational_construct because a cluster is a computed
      object, however convenient it is.

  - id: interpro
    display_name: InterPro
    layers: [sequence_family_evolution]
    good_for:
      - Integrated family, domain and site annotation that constrains which
        candidates share an architecture with the seeds.
      - Detecting that a candidate is missing a domain the mechanism requires,
        which is a cheap and decisive rejection.
      - A stable family vocabulary to group a mined set before any expensive
        modelling.
    not_good_for:
      - A single short motif or site match does not establish activity on a given
        substrate; motifs are shared across enzymes with different scopes.
      - Family membership is a constraint, not evidence, and must never be
        recorded as experimental support.
      - Member-database signatures differ in specificity, so two hits are not
        equally informative.
      - It integrates several member databases, so a hit from InterPro and a hit
        from one of those members are not two independent observations.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: [pfam]
    derived_from_complete: false
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "derived_from lists Pfam only and is marked incomplete -- InterPro
         integrates several member databases, and a curator must list the ones
         this project also queries so they are not counted as independent."
      - "No endpoint recorded. Confirm the API base URL before use."
      - "Scanning a new sequence against the signatures is done with separate
         software rather than by the database; sequence_query is therefore
         unknown here and the scanner must be registered as a tool, not as a
         database capability."
      - "Confirm licence and redistribution terms, and record the release used."
    notes: >-
      Used as a filter on a mined set, never as a reason to advance a candidate.

  - id: pfam
    display_name: Pfam
    layers: [sequence_family_evolution]
    good_for:
      - Domain definitions and curated alignments, which give the position
        numbering a family-wide design discussion needs.
      - Family-level hidden Markov models that make membership decisions explicit
        and reproducible.
      - Identifying the catalytic domain inside a multi-domain candidate.
    not_good_for:
      - A domain assignment is not a function assignment, and a family can
        contain members with opposite stereopreference.
      - Alignment columns are not active-site equivalences; transferring a
        position between members requires a structure-based mapping.
      - Now distributed as part of an integrated resource, so a Pfam hit and an
        InterPro hit are not independent observations.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: supported
      version_information: supported
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 2
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
