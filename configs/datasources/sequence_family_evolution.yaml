  - id: sdred
    display_name: SDRED (short-chain dehydrogenase/reductase engineering database)
    layers: [sequence_family_evolution]
    good_for:
      - Subfamily grouping within the short-chain dehydrogenase/reductase
        superfamily, which is directly the family of the pilot ketone-reduction task.
      - A unified position numbering across the family, which is the single thing
        that makes mutation positions comparable between papers; without it a
        reported position number is meaningless outside its own construct.
      - Conserved structural and sequence features of the family, usable as a
        sanity check on a candidate before any modelling.
      - Cross-subfamily comparison of mutations, which lets an engineering result
        in one subfamily be considered for another without pretending it transfers.
    not_good_for:
      - Family classification is not activity; membership says nothing about the
        target substrate or the product configuration.
      - A position that is conserved is not thereby catalytic, and a position
        mapped through the family numbering still needs a structure-based check
        before it is mutated.
      - No stable public programmatic interface has been verified, so it is
        registered for human import; a pipeline must not be written as though it
        can be queried during a run.
      - Coverage is bounded by what the family curation includes, and is not a
        census of all short-chain dehydrogenases.
    access_modes: [manual_review_import, offline_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: unknown
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
