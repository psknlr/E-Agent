    notes: >-
      Registered as a model store, explicitly not as a prediction service.

  - id: sifts
    display_name: SIFTS (structure-sequence residue mapping)
    layers: [structure_and_mechanism]
    good_for:
      - Residue-level mapping between a sequence database entry and a structure
        chain, which is the only correct way to carry a position between the
        sequence and structure layers.
      - Making author numbering, label numbering and sequence numbering
        reconcilable, so a mutation position means the same thing everywhere.
      - Supporting the composite join key used by this project for structural
        positions.
    not_good_for:
      - It is a mapping, not evidence; it says nothing about function, binding or
        activity.
      - A mapping can be partial where a construct differs from the database
        sequence, and the gap must be surfaced rather than interpolated.
      - It cannot repair a position reported in a paper without a stated
        numbering convention.
    access_modes: [bulk_download, rest_api]
    capabilities:
      keyword_query: not_supported
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: [rcsb_pdb, uniprotkb]
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint recorded. Confirm how the current mapping files are
         distributed and accessed."
      - "Confirm licence and redistribution terms."
      - "Record the mapping release together with the structure and sequence
