    notes: >-
      A base dependency, like SIFTS. It is the authority behind the cofactor
      oxidation-state check in the chemistry schema.

  - id: mcsa
    display_name: M-CSA (Mechanism and Catalytic Site Atlas)
    layers: [structure_and_mechanism]
    good_for:
      - Literature-sourced catalytic residues with their assigned roles, which is
        what a catalytic template needs and what cannot be inferred from a fold.
      - Stepwise mechanism descriptions that make the role of a cofactor and of
        each residue explicit.
      - Reference entries that can anchor a family template with a citation
        rather than an assumption.
    not_good_for:
      - Coverage is partial. Most enzymes have no entry, and absence is not
        evidence that catalytic residues are unknown.
      - An entry is evidenced for its reference enzyme; transferring residue roles
        to a homologue is inference and must be recorded as such, through an
        explicit residue mapping rather than by alignment position alone.
      - It describes mechanism, not substrate scope, rate or stereopreference.
    access_modes: [rest_api, bulk_download, manual_review_import]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
