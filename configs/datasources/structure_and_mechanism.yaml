    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint recorded. Confirm the API base URL and the download route."
      - "Confirm which transfer-quality metrics are returned per transplanted
         ligand, and set the rejection threshold explicitly rather than
         accepting every transplant."
      - "Confirm licence and redistribution terms, and record the version used
         together with the versions of the two upstream resources."
      - "Confirm that the component identifier of each transplanted ligand is
         kept, so the cofactor oxidation-state check can run on it."
    notes: >-
      Because it re-integrates predicted models and experimental structures, it
      does not independently corroborate either of them.
