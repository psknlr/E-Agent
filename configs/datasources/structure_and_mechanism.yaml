      Small, high-value, and the preferred source for catalytic templates when an
      entry exists for the family.

  - id: alphafill
    display_name: AlphaFill
    layers: [structure_and_mechanism]
    good_for:
      - Transferring cofactors, ligands and ions into predicted structures from
        homologous experimental structures, which turns an unusable apo model
        into a testable hypothesis about the holo active site.
      - Supplying a starting cofactor placement for the complex-modelling step
        where no experimental complex exists for the candidate.
      - Transfer metrics that indicate how similar the donor environment was,
        allowing weak transplants to be rejected.
    not_good_for:
      - Every placement is computational inference from a homologue and must be
        recorded with the homology-transplanted ligand source, never as an
        observed ligand; this is the single most likely place for a predicted
        arrangement to be reported as a fact.
      - A transplanted cofactor can be geometrically plausible and chemically
        wrong, including in oxidation state, which the transfer does not check.
      - Transfer quality degrades with donor distance, and a successful transfer
        is not evidence that the candidate binds the cofactor.
      - It is not a substrate-docking service and says nothing about the substrate.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
