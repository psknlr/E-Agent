# Layer 4 -- structure and mechanism.
#
# HONESTY RULE: no endpoint URL, record count, version string or licence term in
# this file was verified in this environment. Unknown specifics are null with
# needs_curation: true. connectivity_verified is false everywhere. Capability
# flags describe documented capability, not proven behaviour.

layer: structure_and_mechanism
layer_question: >-
  Can the substrate, the cofactor and the catalytic residues form a sensible
  arrangement?
agent_stages:
  - complex modelling
  - geometry
notes: >-
  Two base dependencies live in this layer -- the residue-level mapping between
  sequence and structure numbering, and the chemical component dictionary that
  defines ligand atom names. Without both, every geometric criterion in the
  project is measured between atoms nobody can name reproducibly. Ligand origin
  is recorded per structure with the LigandSource enum from the data model, and
  a transplanted or docked ligand is never recorded as an observed one.

sources:
  - id: rcsb_pdb
    display_name: RCSB PDB
    layers: [structure_and_mechanism]
    good_for:
      - Experimentally determined structures, including enzyme complexes with
        cofactor and substrate analogues, which are the only observed evidence of
        an active-site arrangement.
      - Rich search over entry metadata, polymer entities, ligands and assemblies.
      - The deposited construct and its modifications, which is what was actually
        crystallised rather than the canonical database sequence.
    not_good_for:
      - Search results can include computed structure models alongside
        experimental entries; the two must be separated explicitly, because a
        predicted model returned by a structure search looks like a measurement.
      - The deposited construct frequently differs from the wild-type sequence --
        tags, truncations, point mutations introduced for crystallisation -- and
        the actual construct must be checked before any residue claim.
      - Resolution, occupancy and B-factors mean an atom position may be poorly
        determined; a coordinate is not automatically a fact.
      - A ligand present in a structure is not necessarily the substrate, and its
        presence proves binding, not turnover.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: supported
      exact_record_fetch: supported
      sequence_query: unknown
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "No endpoint recorded. Confirm the data and search API base URLs before
         the first call; none has been tested from this environment."
      - "Confirm which field distinguishes an experimental entry from a computed
         structure model in the current search response, and implement that
         filter before any structure is used as observed evidence."
      - "Confirm licence and redistribution terms for coordinates and metadata."
      - "Record the weekly release or entry revision used for a run."
    notes: >-
      The only registered source of observed active-site geometry. Every claim
      taken from it is qualified by the construct actually deposited.

  - id: alphafold_db
    display_name: AlphaFold Protein Structure Database
    layers: [structure_and_mechanism]
    good_for:
      - Reusable predicted monomer structures for sequences with no experimental
        entry, which is most mined candidates.
      - Per-residue confidence estimates, which let low-confidence regions be
        excluded from geometric criteria instead of silently used.
      - A cheap first-pass fold check before any expensive complex prediction.
    not_good_for:
      - Retrieving a stored model and running a complex prediction are different
        capabilities; this resource provides the first and not the second, and a
        plan that assumes it supplies holo complexes is wrong.
      - Models are apo and contain no cofactor, no substrate and no ions, so an
        active site taken from here is incomplete by construction.
      - A confident backbone does not imply correct side-chain rotamers in the
        active site, which is exactly where the geometry matters.
      - A predicted structure is never experimental evidence and must not be
        recorded as an observed arrangement.
    access_modes: [rest_api, bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: not_supported
      bulk_snapshot: unknown
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
