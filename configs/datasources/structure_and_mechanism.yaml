    notes: >-
      A base dependency. Nothing in the mutation layer is trustworthy without it,
      which is why it is stage 1 despite producing no evidence of its own.

  - id: wwpdb_ccd
    display_name: wwPDB Chemical Component Dictionary
    layers: [structure_and_mechanism]
    good_for:
      - Canonical atom names, bonding and chemical identity for every ligand and
        cofactor that appears in a structure, which is what makes an atom-level
        geometric criterion reproducible.
      - Distinguishing cofactor oxidation states that prose labels conflate,
        since the oxidised and reduced nicotinamide cofactors are different
        component identifiers.
      - Supplying the component plus atom-name pair used as a join key for ligand
        atoms.
    not_good_for:
      - It defines chemistry, not occupancy or geometry; a component entry says
        nothing about whether that ligand is present in any particular structure.
      - A component identifier is not a substrate assignment -- many entries are
        buffer components, cryoprotectants and crystallisation additives.
      - It carries no activity or binding evidence.
    access_modes: [bulk_download]
    capabilities:
      keyword_query: unknown
      exact_record_fetch: unknown
      sequence_query: not_supported
      chemical_structure_query: unknown
      bulk_snapshot: supported
      version_information: unknown
      redistribution_allowed: unknown
    license: null
    license_source: null
    needs_legal_review: true
    evidence_strength_ceiling: annotation_only
    derived_from: []
    derived_from_complete: true
    connectivity_verified: false
    endpoint: null
    citations: []
    version: null
    approximate_record_count: null
    priority_stage: 1
    requires_human_review_per_record: false
    needs_curation: true
    curation_notes:
      - "Confirm the current distribution location and update cadence of the
         dictionary; no URL is recorded here."
      - "Confirm licence and redistribution terms."
      - "Record the dictionary version used, because atom naming changes are
