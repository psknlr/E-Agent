# ===========================================================================
# External tool registry -- four licence facets per tool.
#
# Loads with eagent.tools.model_complexes.ToolRegistry.from_config(), which
# reads the `tool_registry` list below and builds one ToolRegistryEntry per
# item. check_license() consults it BEFORE a tool is invoked, because once a
# predictor has run, its weights' terms have already been exercised and its
# outputs already exist.
#
# WHY FOUR ENTRIES PER TOOL AND NOT ONE
# -------------------------------------
# "AlphaFold3: licence X" is the exact statement this file exists to prevent.
# A single licence line hides a conflict that is routine in this field: the
# source code may be permissive while the model parameters are restricted and
# the outputs carry conditions of their own, and the databases fed to the tool
# have terms set by someone else again. So each tool is registered four times,
# with these kinds (the ToolKind enum):
#
#   code            the program itself
#   model_weights   separately distributed learned parameters
#   input_database  the data the tool is fed -- sequence, structure and MSA
#                   databases whose terms travel with every result derived
#                   from them (the per-database detail lives in
#                   configs/datasources/*.yaml)
#   output          what the producer's terms say about the coordinates,
#                   alignments, trees or sequences the tool emits
#
# Keys are "<tool>.<facet>" so that a missing facet is visible at a glance.
#
# COMMERCIAL USE: permitted / restricted / unknown
# ------------------------------------------------
# permits_commercial_use is tri-state and is read by code that blocks or
# permits a run:
#     true  -> permitted   (a positive, recorded permission)
#     false -> restricted  (terms read, and they forbid it)
#     null  -> unknown     (nobody has read the terms)
# check_license() refuses a commercial run on null exactly as it does on false,
# because an unverified licence is not a permission.
#
# AN ENTRY RECORDS unknown UNLESS A DOCUMENT WAS READ, AND SAYS WHICH
# ----------------------------------------------------------------
# Licence terms attach to a RELEASE and they change between releases, so a
# licence string written from memory for an unspecified version would be an
# unsourced legal claim that this pipeline would then cite in provenance. The
# ToolRegistryEntry model enforces the same discipline: a licence may only be
# recorded together with license_source, and a commercial-use permission may
# only be recorded together with a licence.
#
# So: license: null, license_source: null, permits_commercial_use: null and
# needs_legal_review: true, except
#   * on the facets marked NOT APPLICABLE, where the artefact does not exist
#     and there is nothing to read; and
#   * on the facets whose license_source names a document that WAS read, and
#     when. As of 2026-10-07 those are: boltz.code and boltz.model_weights
#     (the LICENSE and README inside the boltz 2.2.1 release), the
#     AutoDock Vina code (its repository LICENSE), the gnina code licence
#     statement (its README), and the entries in the "Licence-constrained
#     tools" block at the end of this file, which record restrictions
#     reported to the project and say who reported them.
# A recorded licence is never a legal opinion: needs_legal_review stays true
# on every one of them, the version actually deployed must still be pinned, and
# a document read for one release says nothing about another.
#
# Each entry's notes say exactly which document a curator must read. The
# consequence of leaving an entry unknown is loud and safe, not silent: every
# allow_commercial_use=True run that touches it is blocked until someone
# records the terms.
#
# No URL appears in this file. None could be verified here, and a plausible
# but wrong URL would be fetched.
# ===========================================================================

registry_policy:
  recorded_in_this_environment: false
  facet_kinds: [code, model_weights, input_database, output]
  commercial_use_encoding:
    permitted: "permits_commercial_use: true"
    restricted: "permits_commercial_use: false"
    unknown: "permits_commercial_use: null (blocks a commercial run)"
  curator_instructions:
    - "Pin the installed version first. Terms attach to a release."
    - "Record license together with license_source naming the document read and the date."
    - "Set permits_commercial_use only from a licence you have read."
    - "Set needs_legal_review false only once a human has signed off on that facet."
    - "A NOT APPLICABLE facet must not be listed in an adapter's registry_keys: check_license treats an unrecorded permission as a block, and a facet that does not exist cannot grant one."

