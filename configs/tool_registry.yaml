# ===========================================================================
# Licence-constrained tools: restrictions REPORTED to the project, not read
# ===========================================================================
# The two tools below were named in the operator's review of competing agents,
# with licence terms that constrain how this project may use them. Neither
# repository was located or opened in the session that wrote these entries --
# a web search for each returned nothing that identifies it -- so the
# licence_source of every entry says "reported", not "read", and
# needs_legal_review stays true.
#
# The asymmetry is deliberate. A reported RESTRICTION is recorded as a
# restriction (permits_*: false): acting on it can only block work, and being
# wrong costs a curator one look at the repository. A reported PERMISSION is
# NOT recorded as one (permits_*: null): an unverified licence is not a
# permission, which is the rule this whole file exists to apply.
#
# What the report says, in the operator's words:
#   VenusMine -- currently CC BY-NC-ND 4.0, so it cannot be treated as MIT or
#     Apache code, modified, and republished.
#   AP Novo   -- the code is Apache 2.0, but the model weights and the outputs
#     carry separate non-commercial-use terms.
# ===========================================================================

