[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eagent"
version = "0.1.0"
description = "Reaction-indexed agent for enzyme function mining and substrate-directed engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "click>=8.0",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
bio = ["biopython>=1.81"]
numeric = ["numpy>=1.24"]
dev = ["pytest>=7.4"]

[project.scripts]
eagent = "eagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
